services:
  solidbench:
    image: ghcr.io/jitsedesmet/solidbench-sgv:latest
    build:
      context: .
      dockerfile: database.dockerfile
      network: host
    ports:
      - "3000:3000"
  webapp:
    image: ghcr.io/jitsedesmet/sgv-web-app:latest
    build:
      context: .
      dockerfile: webapp.dockerfile
      network: host
    ports:
      - "3001:3000"
# Run docker compose rm -f to remove anonymous volumes attached to containers